add_transaction:
  fields:
    kind:
      required: true
      selector:
        select:
          options:
            - income
            - expense
    amount:
      required: true
      example: "12.50"
      selector:
        text:
    category:
      required: true
      example: Food
      selector:
        text:
    budget:
      example: Needs
      selector:
        text:
    date:
      selector:
        date:
    description:
      selector:
        text:
    tags:
      selector:
        text:
          multiple: true

update_transaction:
  fields:
    id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    kind:
      selector:
        select:
          options:
            - income
            - expense
    amount:
      example: "12.50"
      selector:
        text:
    category:
      selector:
        text:
    budget:
      selector:
        text:
    date:
      selector:
        date:
    description:
      selector:
        text:
    tags:
      selector:
        text:
          multiple: true

delete_transaction:
  fields:
    id:
      required: true
      selector:
        number:
          min: 1
          mode: box

start_period:
  fields:
    date:
      selector:
        date:
    name:
      selector:
        text:

get_summary:
  fields:
    period:
      example: current
      default: current
      selector:
        text:

list_transactions:
  fields:
    period:
      example: current
      selector:
        text:
    date_from:
      selector:
        date:
    date_to:
      selector:
        date:
    kind:
      selector:
        select:
          options:
            - income
            - expense
    category:
      example: Food
      selector:
        text:
    budget:
      example: Needs
      selector:
        text:
    tag:
      selector:
        text:
    user:
      selector:
        text:
    search:
      selector:
        text:
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 500
          mode: box
    offset:
      default: 0
      selector:
        number:
          min: 0
          mode: box

add_category:
  fields:
    name:
      required: true
      example: Pets
      selector:
        text:
    kind:
      required: true
      selector:
        select:
          options:
            - income
            - expense
    icon:
      default: mdi:tag
      selector:
        icon:

update_category:
  fields:
    category:
      required: true
      example: Food
      selector:
        text:
    kind:
      selector:
        select:
          options:
            - income
            - expense
    name:
      selector:
        text:
    icon:
      selector:
        icon:
    archived:
      selector:
        boolean:

delete_category:
  fields:
    category:
      required: true
      example: Food
      selector:
        text:
    kind:
      selector:
        select:
          options:
            - income
            - expense
