# Type-check the integration with Home Assistant installed (.venv-ha):
#   .venv-ha/bin/mypy --config-file tests/integration/mypy.ini
[mypy]
python_version = 3.14
strict = true
files = custom_components, tests/integration
explicit_package_bases = true

# HA re-exports names without __all__; strict mypy would reject e.g. websocket_api.async_response.
[mypy-homeassistant.*]
implicit_reexport = true

[mypy-pytest_homeassistant_custom_component.*]
follow_untyped_imports = true

# Tests index optional states and responses directly; a None fails the test anyway.
[mypy-tests.integration.*]
disable_error_code = union-attr, index
