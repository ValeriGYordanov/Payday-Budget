[tool.pytest.ini_options]
pythonpath = ["payday_budget"]
testpaths = ["tests/addon"]  # integration tests: see tests/integration/pytest.ini
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "payday_budget"
exclude = ["^custom_components/", "^tests/integration/"]  # checked with .venv-ha
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
