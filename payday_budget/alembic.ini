# For manual use: `alembic -c payday_budget/alembic.ini upgrade head`.
# The add-on applies migrations itself on start (app/migrate.py).
[alembic]
script_location = %(here)s/migrations
sqlalchemy.url = sqlite:////data/payday_budget.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
