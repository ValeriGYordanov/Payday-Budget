name: Payday Budget
version: "1.2.0"
slug: payday_budget
description: Budgeting with periods that start on payday, not on the 1st.
url: https://github.com/ValeriGYordanov/Payday-Budget
# Prebuilt multi-arch image, published by .github/workflows/build-app.yaml on release.
image: ghcr.io/valerigyordanov/payday-budget
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:wallet
panel_title: Budget
panel_admin: false
hassio_api: true
discovery:
  - payday_budget
backup: cold
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
